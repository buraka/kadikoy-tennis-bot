name: KadikoyTenis
options:
  bundleIdPrefix: com.brk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  KadikoyTenis:
    type: application
    platform: iOS
    sources:
      - path: KadikoyTenis
        excludes:
          - KadikoyTenis.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brk.tenis
        PRODUCT_NAME: KadikoyTenis
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KadikoyTenis/KadikoyTenis.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KadikoyTenis/Info.plist
      properties:
        CFBundleDisplayName: Kadıköy Tenis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Filled from Config.xcconfig / Secrets.xcconfig (tools/ios-config.sh writes the latter after deploy)
        SLOTS_URL: $(SLOTS_URL)
        REGISTER_URL: $(REGISTER_URL)
        APP_SECRET: $(APP_SECRET)
